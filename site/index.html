<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台股上市櫃 技術選股</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1d2330;--mute:#6b7280;--line:#e3e6eb;--acc:#1f5eff;--up:#d32f2f;--dn:#2e7d32;--hl:#eef3ff}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--fg:#e6e9ef;--mute:#9aa3b2;--line:#2b313c;--acc:#7aa2ff;--hl:#232c3d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card)}
header h1{font-size:18px;margin:0}
#status{color:var(--mute);font-size:13px}
.layout{display:grid;grid-template-columns:280px 1fr;gap:16px;padding:16px 20px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr;padding:12px}}
aside,.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
aside label{display:block;margin:10px 0 4px;font-weight:600}
aside select,aside input[type=number],aside input[type=search]{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
.hint{color:var(--mute);font-size:12.5px;margin:6px 0 0;min-height:1em}
.row2{display:flex;gap:6px;align-items:center}.row2 input{width:50%!important}
.chk{display:flex;gap:6px;align-items:center;font-weight:400!important;margin:4px 0!important}
.inline{display:flex;gap:14px}
details{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600;color:var(--acc)}
fieldset{border:none;padding:0;margin:10px 0 0}legend{font-weight:600;color:var(--mute);font-size:12.5px}
button{font:inherit;padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
#count{margin:0 0 8px;color:var(--mute)}
.tablewrap{overflow:auto;max-height:70vh}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
th{position:sticky;top:0;background:var(--card);cursor:pointer;user-select:none;font-weight:600}
th.l,td.l{text-align:left}
tbody tr{cursor:pointer}tbody tr:hover,tbody tr.sel{background:var(--hl)}
.pos{color:var(--up)}.neg{color:var(--dn)}.stale{color:var(--mute)}
#btBox table td,#btBox table th{font-size:13px}
#btBox tr.click{cursor:pointer}#btBox tr.click:hover{background:var(--hl)}
#btBox h3,#diag h3{font-size:15px;margin:14px 0 6px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.dbox{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.dbox b{display:block;margin-bottom:4px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:1px 0}
.kv span:first-child{color:var(--mute)}
.gauge{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.gauge .big{font-size:30px;font-weight:700}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:6px 0;max-width:420px}
.bar i{display:block;height:100%;background:var(--acc)}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
.good{color:var(--up);font-weight:600}.warn{color:var(--mute)}
.reason{white-space:normal;min-width:180px;text-align:left;color:var(--mute);font-size:12.5px}
#chartBox{margin-bottom:16px}
.chartHead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.chartHead h2{font-size:16px;margin:0}
#links{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
#links a{font-size:12.5px;padding:3px 9px;border:1px solid var(--line);border-radius:999px;color:var(--acc);text-decoration:none;background:var(--bg)}
#links a:hover{border-color:var(--acc)}
#chart{height:640px}
</style>
</head>
<body>
<header><h1>台股上市櫃 技術選股</h1><span id="status">載入中…</span>
  <span style="margin-left:auto;display:flex;gap:8px;align-items:center">
    <select id="btPeriod" title="上漲機率與回測使用的歷史期間">
      <option value="1y">統計期間：近 1 年</option><option value="3y">統計期間：近 3 年</option><option value="5y">統計期間：近 5 年</option></select>
    <button id="btBtn">📊 回測：哪些指標有效</button></span></header>
<div class="layout">
<aside>
  <label for="preset">策略選股</label>
  <select id="preset"></select>
  <p class="hint" id="presetDesc"></p>

  <label>市場</label>
  <div class="inline">
    <label class="chk"><input type="checkbox" name="mkt" value="上市" checked>上市</label>
    <label class="chk"><input type="checkbox" name="mkt" value="上櫃" checked>上櫃</label>
  </div>
  <label for="ind">產業</label>
  <select id="ind"><option value="">全部</option></select>
  <label for="minvol">最低成交量（張）</label>
  <input id="minvol" type="number" value="500" step="100" min="0">
  <label for="q">搜尋代號／名稱（按 Enter 看個股診斷）</label>
  <input id="q" type="search" placeholder="例：2330 或 台積電">

  <details id="adv">
    <summary>進階篩選</summary>
    <label>量比 ≥（今日量／20日均量）</label><input id="vr" type="number" step="0.1" min="0" placeholder="不限">
    <label>RSI(14) 區間</label><div class="row2"><input id="rsiMin" type="number" placeholder="最小">～<input id="rsiMax" type="number" placeholder="最大"></div>
    <label>K 值 區間</label><div class="row2"><input id="kMin" type="number" placeholder="最小">～<input id="kMax" type="number" placeholder="最大"></div>
    <label>20 日漲跌 % 區間</label><div class="row2"><input id="r20Min" type="number" placeholder="最小">～<input id="r20Max" type="number" placeholder="最大"></div>
    <label>ADX ≥（&gt;25 代表有趨勢）</label><input id="adx" type="number" min="0" placeholder="不限">
    <label>上漲機率 ≥（%，10 日內漲 ≥10% 的模型估計）</label><input id="pmin" type="number" step="1" placeholder="不限">
    <label>布林上軌 3 日斜率 ≥（%／日，自動排除月線下彎）</label><input id="bbs" type="number" step="0.1" placeholder="不限">
    <label>外資 5 日買超佔股本 ≥（‰）</label><input id="fcap" type="number" step="0.5" placeholder="不限">
    <label>投信 5 日買超佔股本 ≥（‰）</label><input id="tcap" type="number" step="0.5" placeholder="不限">
    <div id="flags"></div>
  </details>
  <p style="margin-top:14px"><button id="reset">重設條件</button></p>
</aside>

<section>
  <div id="btBox" class="card" hidden style="margin-bottom:16px"></div>
  <div id="diag" class="card" hidden style="margin-bottom:16px"></div>
  <div id="chartBox" class="card" hidden>
    <div class="chartHead">
      <div><h2 id="chartTitle"></h2><div id="links"></div></div>
      <div class="inline" style="align-items:center">
        <select id="sub"></select>
        <label class="chk"><input type="checkbox" id="bb">布林通道</label>
        <label class="chk"><input type="checkbox" id="sr">支撐壓力</label>
        <button id="closeChart">關閉</button>
      </div>
    </div>
    <div id="chart"></div>
  </div>
  <div class="card">
    <div class="chartHead"><p id="count" style="margin:0"></p>
      <select id="view"><option value="all">表格：全部欄位</option><option value="t" selected>表格：技術面</option><option value="c">表格：籌碼面</option><option value="d">表格：當沖</option></select></div>
    <div class="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
  </div>
</section>
</div>

<script>
"use strict";
// ------------------------------------------------------------------ 設定
const FLAGS = [
  ["均線", [["ma20_bend","月線上彎（5日加權斜率>0且加速）"],["ma20_turn","月線剛翻揚（斜率由負轉正）"],["ma_bull","均線多頭排列（5>20>60）"],["above_ma20","站上月線 MA20"],["above_ma60","站上季線 MA60"],
           ["above_ma120","站上半年線"],["above_ma240","站上年線"],["ma_tangle","均線糾結"]]],
  ["動能", [["kd_golden","KD 今日黃金交叉"],["kd_low_gold","KD 低檔(<30)黃金交叉"],["macd_golden","MACD 今日黃金交叉"],
           ["macd_pos","DIF 在 MACD 之上"],["dmi_bull","+DI > -DI"],["obv_up","OBV 在 20 日均線上"]]],
  ["布林通道", [["bb_up3_good","上軌 3 日斜率向上，且月線 3 日未遞減"],["ma20_nodown3","月線近 3 日未遞減（排除月線下彎）"],["bb_mid_up","中軌（月線）上揚"],["bb_open","開口變大（參考月線）"],["bb_shrink","開口變小（參考月線）"],
           ["bb60_open","開口變大（參考季線）"],["bb60_shrink","開口變小（參考季線）"],
           ["bb_upper_zone","股價介於上軌與中軌"],["bb_lower_zone","股價介於中軌與下軌"]]],
  ["型態／量能", [["breakout20","突破前 20 日高點"],["near_high52","距 52 週高 5% 內"],["bb_squeeze","布林收斂"],
           ["bb_up_break","突破布林上軌"],["bb_dn_break","跌破布林下軌"],["up3","連 3 日收紅"],["vol_expand","5日均量 > 20日均量"]]],
  ["籌碼", [["c_f_buy","外資今日買超"],["c_t_buy","投信今日買超"],["c_all_buy","三大法人今日同步買超"],
           ["c_f_streak","外資連買 ≥ 3 日"],["c_t_streak","投信連買 ≥ 3 日"],["c_tot5","法人 5 日合計買超"],
           ["c_f_cap","外資 5 日買超 ≥ 1‰ 股本"],["c_t_cap","投信 5 日買超 ≥ 1‰ 股本"],["c_t_cap20","投信 20 日買超 ≥ 5‰ 股本"],
           ["c_f_flip","外資翻多（近5日轉買超）"],["c_t_flip","投信翻多（近5日轉買超）"],
           ["c_m_down","融資今日減少"],["c_m_down5","融資 5 日減少"],["c_ms20","券資比 ≥ 20%"]]],
  ["權證", [["w_hot","認購權證成交暴增（≥ 3 倍）"],["w_big","認購權證成交額 ≥ 現股 5%"],["w_callside","認購 ≫ 認售（售/購比 < 0.3）"]]]
];
// 籌碼旗標：由數值欄位推出（資料缺漏時為 undefined → 不符合）
function chipFlags(r){
  r.c_f_buy = r.f1>0; r.c_t_buy = r.t1>0; r.c_all_buy = r.f1>0 && r.t1>0 && r.d1>0;
  r.c_f_streak = r.f_streak>=3; r.c_t_streak = r.t_streak>=3; r.c_tot5 = r.tot5>0;
  r.c_m_down = r.m_chg<0; r.c_m_down5 = r.m_chg5<0; r.c_ms20 = r.ms_ratio>=20;
  r.c_f_flip = r.f5>0 && !(r.f5_prev>0); r.c_t_flip = r.t5>0 && !(r.t5_prev>0);
  r.c_f_cap = r.f5_cap>=1; r.c_t_cap = r.t5_cap>=1; r.c_t_cap20 = r.t20_cap>=5;
  r.w_hot = r.w_surge>=3; r.w_big = r.w_ratio>=5; r.w_callside = r.w_call>0 && r.w_pc<0.3;
  // 均線／布林斜率旗標
  r.ma20_bend = r.ma20_s>0 && r.ma20_s>r.ma20_s_prev; r.ma20_turn = r.ma20_s>0 && r.ma20_s_prev<=0;
  r.bb_mid_up = r.ma20_s>0; r.bb_open = r.bbw_s>0; r.bb_shrink = r.bbw_s<0;
  r.bb60_open = r.bbw60_s>0; r.bb60_shrink = r.bbw60_s<0;
  r.bb_up3_good = r.bb_up_s3>0 && r.ma20_nodown3===true;
  r.bb_upper_zone = r.bb_pos>=0.5 && r.bb_pos<=1; r.bb_lower_zone = r.bb_pos>=0 && r.bb_pos<0.5;
  // 當沖方向：5 個條件各 ±1 分，≥3 偏多、≤-3 偏空
  const sc = [r.close>r.ma5, r.ma5_s>0, r.day_pos>0.5, r.hist>r.hist_prev, r.tot1>0];
  const neg = [r.close<r.ma5, r.ma5_s<0, r.day_pos<0.5, r.hist<r.hist_prev, r.tot1<0];
  r.dt_score = sc.filter(Boolean).length - neg.filter(Boolean).length;
  r.dt_dir = r.dt_score>=3 ? "偏多" : r.dt_score<=-3 ? "偏空" : "觀望";
  return r;
}
const desc = (a,b) => (x,y) => cmpNum(y[a],x[a]) || (b ? cmpNum(y[b],x[b]) : 0);
const PRESETS = {
  none:    {name:"（不使用）", desc:"不套用策略，只用左邊條件篩選。點表格任一列看線圖。"},
  bottom:  {name:"低檔轉強",
    desc:"前提：距 60 日低點 15% 內，且在季線下或 60 日跌幅 >10%，近 10 日 RSI 曾 <35 或近 5 日 K 曾 <25。訊號至少 2 個：KD 低檔金叉、MACD 綠柱縮短、站回 5 日線、帶量紅K、RSI 脫離 30、OBV 翻揚。",
    base:r => r.low60_dist<=15 && (r.above_ma60===false || r.ret60<-10) && (r.rsi_min10<35 || r.k_min5<25),
    sigs:[["KD低檔金叉",r=>r.kd_golden===true && r.K<40],["MACD綠柱縮短",r=>r.hist_prev<0 && r.hist>r.hist_prev],
          ["站回5日線",r=>r.reclaim_ma5===true],["帶量紅K",r=>r.red===true && r.vol_ratio>=1.2],
          ["RSI脫離超賣",r=>r.rsi_prev<=30 && r.rsi>30],["OBV翻揚",r=>r.obv_up===true]],
    min:2, sort:desc("score","vol_ratio")},
  daytrade:{name:"當沖候選",
    desc:"前提：20 日均量 ≥ 3,000 張、均成交值 ≥ 3 億、股價 20–1,000 元、20 日平均振幅 ≥ 3%。加分：振幅 ≥5%、ATR% 3–8、今日量增、今日漲跌 ≥3%、ADX ≥25、方向明確。方向：站上/跌破5日線、5日線斜率、收盤在當日高/低半部、MACD柱、法人買賣，5項合計 ≥+3 偏多、≤−3 偏空。支撐／壓力為 CDP（以最近一日高低收推算下一交易日）：壓力 NH、強壓力 AH、支撐 NL、強支撐 AL。※ 做空需可現股當沖先賣、非平盤下禁空；下單前確認非處置/注意股。",
    base:r => r.vma20_lots>=3000 && r.turnover20>=3 && r.close>=20 && r.close<=1000 && r.amp20>=3,
    sigs:[["振幅≥5%",r=>r.amp20>=5],["ATR%適中",r=>r.atr_pct>=3 && r.atr_pct<=8],["今日量增",r=>r.vol_ratio>=1.3],
          ["今日波動大",r=>Math.abs(r.chg_pct)>=3],["趨勢明確",r=>r.adx>=25],["方向明確",r=>r.dt_dir!=="觀望"]],
    min:0, sort:desc("score","amp20")},
  breakout:{name:"量價突破",
    desc:"前提：收盤突破前 20 日高點、量比 ≥1.5、收紅K。加分：均線多頭、ADX ≥20、近 52 週高、OBV 走強、MACD 多方。",
    base:r => r.breakout20===true && r.vol_ratio>=1.5 && r.red===true,
    sigs:[["均線多頭",r=>r.ma_bull===true],["ADX≥20",r=>r.adx>=20],["近52週高",r=>r.near_high52===true],
          ["OBV走強",r=>r.obv_up===true],["MACD多方",r=>r.macd_pos===true],["法人買超",r=>r.tot1>0]],
    min:0, sort:desc("score","vol_ratio")},
  pullback:{name:"多頭回檔",
    desc:"前提：月線 > 季線且季線上揚、乖離率 -3%～+2%、K < 50。加分：守住月線、回檔量縮、KD 金叉、MACD 柱轉強、收紅K。",
    base:r => r.trend_up===true && r.bias20>=-3 && r.bias20<=2 && r.K<50,
    sigs:[["守住月線",r=>r.above_ma20===true],["回檔量縮",r=>r.vol_expand===false],["KD金叉",r=>r.kd_golden===true],
          ["MACD柱轉強",r=>r.hist>r.hist_prev],["收紅K",r=>r.red===true],["法人5日買超",r=>r.tot5>0]],
    min:0, sort:(x,y)=>cmpNum(y.score,x.score) || cmpNum(x.bias20,y.bias20)},
  squeeze: {name:"布林收斂待發",
    desc:"前提：布林帶寬接近 120 日低點。加分：量能放大、MACD 多方、站上中軌、收紅K。",
    base:r => r.bb_squeeze===true,
    sigs:[["量能放大",r=>r.vol_expand===true],["MACD多方",r=>r.macd_pos===true],["站上中軌",r=>r.bb_pos>0.5],["收紅K",r=>r.red===true]],
    min:0, sort:desc("score","vol_ratio")},
  maflip:  {name:"月線上彎＋法人翻多",
    desc:"前提：月線上彎（近5日加權斜率>0且比前一段更陡，或剛由負轉正），且外資或投信翻多（近5日由賣轉買，或連買 ≥2 日）。支撐＝10日線、月線、10日低點中位於股價下方且最近者；距支撐越近越適合找點做多。加分：月線剛翻揚、距支撐 ≤3%、量縮回測、布林開口變大、KD 金叉、法人今日買超。",
    base:r => r.ma20_bend===true && (r.c_f_flip===true || r.c_t_flip===true || r.f_streak>=2 || r.t_streak>=2) && isNum(r.sup_dist),
    sigs:[["月線剛翻揚",r=>r.ma20_turn===true],["距支撐≤3%",r=>r.sup_dist<=3],["量縮回測",r=>r.vol_ratio<1],
          ["開口變大",r=>r.bb_open===true],["KD金叉",r=>r.kd_golden===true],["法人今日買",r=>r.tot1>0]],
    min:0, sort:(x,y)=>cmpNum(y.score,x.score) || cmpNum(x.sup_dist,y.sup_dist)},
  bbup:    {name:"布林上軌擴張（多方開口）",
    desc:"上軌近 3 日斜率＝（第2天−第1天 ＋ 第3天−第2天）÷ 2，即兩段斜率的平均。前提：上軌 3 日斜率 > 0，且月線（中軌）近 3 日沒有遞減，排除『向下崩跌造成的開口』。加分：收在中軌之上、貼近上軌（布林位置 ≥ 0.8）、量能放大、法人 5 日買超、MACD 多方。依上軌斜率 % 由大到小排序。",
    base:r => r.bb_up_s3>0 && r.ma20_nodown3===true,
    sigs:[["收在中軌上",r=>r.bb_pos>0.5],["貼近上軌",r=>r.bb_pos>=0.8],["量能放大",r=>r.vol_expand===true],
          ["法人5日買超",r=>r.tot5>0],["MACD多方",r=>r.macd_pos===true]],
    min:0, sort:(x,y)=>cmpNum(y.bb_up_s3_pct,x.bb_up_s3_pct)},
  trust:   {name:"投信認養",
    desc:"前提：投信連續買超 ≥ 3 日，且 5 日合計買超。加分：站上月線、均線多頭、外資 5 日也買超、融資 5 日減少、量能放大。",
    base:r => r.t_streak>=3 && r.t5>0,
    sigs:[["站上月線",r=>r.above_ma20===true],["均線多頭",r=>r.ma_bull===true],["外資同買",r=>r.f5>0],
          ["融資減少",r=>r.m_chg5<0],["量能放大",r=>r.vol_expand===true],["投信20日≥5‰股本",r=>r.t20_cap>=5]],
    min:0, sort:desc("score","t20_cap")},
  warrant: {name:"權證異常買盤",

const $ = id => document.getElementById(id);
const isNum = v => typeof v === "number" && !Number.isNaN(v);
function cmpNum(a,b){ const A=isNum(a),B=isNum(b); if(!A&&!B) return 0; if(!A) return 1; if(!B) return -1; return a-b; }
function cmpAny(a,b){ return (typeof a==="string"||typeof b==="string") ? String(a??"").localeCompare(String(b??""),"zh-Hant") : cmpNum(a,b); }
function val(id){ const v=$(id).value.trim(); return v==="" ? null : Number(v); }
function fmt(v,d){ return isNum(v) ? v.toLocaleString("zh-TW",{minimumFractionDigits:d,maximumFractionDigits:d}) : "–"; }

// ------------------------------------------------------------------ 篩選
function filterRows(){
  const mk=[...document.querySelectorAll("input[name=mkt]:checked")].map(c=>c.value);
  const ind=$("ind").value, minvol=val("minvol")??0, q=$("q").value.trim().toLowerCase();
  const rng=[["rsi","rsiMin","rsiMax"],["K","kMin","kMax"],["ret20","r20Min","r20Max"]];
  const vr=val("vr"), adx=val("adx"), fcap=val("fcap"), tcap=val("tcap"), bbs=val("bbs"), pmin=val("pmin");
  const flags=[...document.querySelectorAll(".flag:checked")].map(c=>c.value);
  let rows = DATA.filter(r=>{
    if(!mk.includes(r.market)) return false;
    if(ind && r.industry!==ind) return false;
    if(q && !(r.code.includes(q) || r.name.toLowerCase().includes(q))) return false;
    if(!(r.vol_lots>=minvol)) return false;
    if(vr!==null && !(r.vol_ratio>=vr)) return false;
    if(adx!==null && !(r.adx>=adx)) return false;
    if(pmin!==null && !(r.prob>=pmin)) return false;
    if(bbs!==null && !(r.bb_up_s3_pct>=bbs && r.ma20_nodown3===true)) return false;
    if(fcap!==null && !(r.f5_cap>=fcap)) return false;
    if(tcap!==null && !(r.t5_cap>=tcap)) return false;
    for(const [k,a,b] of rng){ const lo=val(a), hi=val(b);
      if(lo!==null && !(r[k]>=lo)) return false; if(hi!==null && !(r[k]<=hi)) return false; }
    for(const f of flags) if(r[f]!==true) return false;
    return true;
  });
  const p = PRESETS[$("preset").value];
  $("presetDesc").textContent = p.desc;
  if(p.base){
    rows = rows.filter(r=>p.base(r)===true).map(r=>{
      const hit=p.sigs.filter(([,f])=>f(r)===true).map(([t])=>t);
      return {...r, score:hit.length, reason:hit.join("、")};
    }).filter(r=>r.score>=p.min).sort(p.sort);
  } else rows.sort(desc("vol_ratio"));
  if(sortKey) rows.sort((a,b)=>sortDir*cmpAny(a[sortKey],b[sortKey]));
  return rows;
}

function render(){
  if(!DATA.length) return;
  const rows=filterRows(), presetOn=$("preset").value!=="none";
  const view=$("view").value;
  const pk=$("preset").value;
  const cols=COLS_ALL.filter(c=>{
    if(c.preset) return presetOn;
    if(c.g==="s") return pk==="maflip" || view==="all";               // 做多支撐欄位只在該策略顯示
    if(c.g==="t2") return view==="t";
    return view==="all" || !c.g || VIEW_GROUPS[view].includes(c.g);
  });
  lastRows=rows;
  $("count").textContent=`符合條件：${rows.length} 檔`+(rows.length>MAX_ROWS?`（只顯示前 ${MAX_ROWS} 檔）`:"")+"　點任一列看線圖，點欄位標題可排序"+VIEW_NOTE[$("view").value];
  $("thead").innerHTML="<tr>"+cols.map(c=>`<th class="${c.l?"l":""}" data-k="${c.k}">${c.t}${sortKey===c.k?(sortDir>0?" ▲":" ▼"):""}</th>`).join("")+"</tr>";
  $("tbody").innerHTML=rows.slice(0,MAX_ROWS).map((r,i)=>`<tr data-i="${i}" class="${current&&current.code===r.code?"sel":""}">`+cols.map(c=>{
    let v=r[c.k], cls=c.cls||(c.l?"l":"");
    if(c.d!==undefined){ if(c.sign&&isNum(v)) cls+=v>0?" pos":v<0?" neg":""; v=fmt(v,c.d); }
    if(c.k==="dt_dir") cls+= v==="偏多"?" pos":v==="偏空"?" neg":"";
    if(c.k==="name" && r.date<META.last_date) v+=` <span class="stale" title="資料停在 ${r.date}">*</span>`;
    return `<td class="${cls}">${v??""}</td>`;
  }).join("")+"</tr>").join("");
}

$("thead").addEventListener("click",e=>{
  const k=e.target.closest("th")?.dataset.k; if(!k) return;
  if(sortKey===k) sortDir=-sortDir; else { sortKey=k; sortDir=["code","name","market","industry"].includes(k)?1:-1; }
  render();
});

           catch(e){ box.textContent="尚未產生回測結果：每天第一次收盤後更新時會自動計算，請稍後再看。"; return; } }
  renderBT();
};
const FLAG_KEYS = new Set(FLAGS.flatMap(([,items])=>items.map(([k])=>k)));
function canApply(k){ return FLAG_KEYS.has(k) || (k.startsWith("P_") && PRESETS[k.slice(2)]) || k==="vol15" || k==="adx25"; }
function applyKeys(keys){
  $("reset").click();
  for(const k of keys){
    if(k.startsWith("P_")) $("preset").value=k.slice(2);
    else if(k==="vol15") $("vr").value=1.5;
    else if(k==="adx25") $("adx").value=25;
    else { const c=document.querySelector(`.flag[value="${k}"]`); if(c) c.checked=true; }
  }
  $("adv").open = keys.some(k=>!k.startsWith("P_"));
  sortKey=null; render(); $("btBox").hidden=true;
  document.querySelector(".tablewrap").scrollIntoView({behavior:"smooth"});
}
function stable(r){ return r.lift_h1!=null && r.lift_h2!=null && r.lift_h1>=1.1 && r.lift_h2>=1.1; }
function btRow(r, keys){
  const ok=keys.every(canApply), few=r.n<300;
  const st=r.lift_h1==null||r.lift_h2==null ? "–" : `${r.lift_h1} / ${r.lift_h2}`;
  return `<tr class="${ok?"click":""}" data-keys="${keys.join(",")}">
    <td class="l">${r.name}${few?' <span class="tag">樣本少</span>':""}${stable(r)&&r.lift>=1.2&&!few?' <span class="tag good">穩定有效</span>':""}</td>
    <td>${r.n.toLocaleString()}</td><td>${fmt(r.p_big,1)}%</td>
    <td class="${r.lift>=1.2?"good":""}">${fmt(r.lift,2)}×</td><td>${st}</td>
    <td class="${r.r5>0?"pos":"neg"}">${fmt(r.r5,2)}%</td><td class="${r.r20>0?"pos":"neg"}">${fmt(r.r20,2)}%</td>
    <td>${fmt(r.win20,1)}%</td><td>${ok?"套用 →":""}</td></tr>`;
}
function renderBT(){
  const b=BTP(); if(!b){ $("btBox").textContent="這個期間沒有回測結果。"; return; }
  const head=`<tr><th class="l">條件</th><th>樣本數</th><th>10日內漲≥${b.big}%機率</th><th>倍數</th><th>穩定度（前半／後半）</th><th>平均5日報酬</th><th>平均20日報酬</th><th>20日勝率</th><th></th></tr>`;
  const sigs=[...b.signals].sort((x,y)=>btSort==="lift"?cmpNum(y.lift,x.lift):cmpNum(y.r20,x.r20));
  const best=sigs.filter(r=>r.n>=300 && r.lift>=1.2 && stable(r)).slice(0,6);
  $("btBox").innerHTML=`
   <div class="chartHead"><h2>回測（${PLABEL[PERIOD]}）：出現訊號後，10 個交易日內漲 ${b.big}% 以上的機率</h2><button id="btClose">關閉</button></div>
   <p class="hint">期間 ${b.period?b.period.join(" ～ "):"–"}（籌碼 ${b.chip_period?b.chip_period.join(" ～ "):"資料累積中"}），${b.n_stocks} 檔，
   只計入 20 日均量 ≥ ${b.min_vol} 張、股價 ≥ 10 元的日子。<b>基準</b>：任一天隨機挑一檔，10 日內漲 ${b.big}% 的機率是 ${b.baseline.p_big}%
   （籌碼類以 ${b.baseline_chip.p_big??"–"}% 為基準）。<b>倍數</b>＝訊號機率 ÷ 基準，1.5× 代表比亂挑高 50%。
   <b>穩定度</b>＝把期間切成前後兩半各算一次倍數，兩半都 ≥ 1.1 才標「穩定有效」。更新於 ${b.generated}。點有「套用」的列會直接帶入篩選條件。</p>
   <h3>建議優先使用</h3>
   ${best.length?`<div class="tablewrap"><table><thead>${head}</thead><tbody>${best.map(r=>btRow(r,[r.key])).join("")}</tbody></table></div>`:'<p class="hint">目前沒有同時符合「樣本 ≥ 300、倍數 ≥ 1.2、前後半都有效」的條件；籌碼資料累積更久後會更準。</p>'}
   <h3>兩兩組合（倍數最高 20 組）</h3>
   <div class="tablewrap"><table><thead>${head}</thead><tbody>${b.combos.map(r=>btRow(r,r.keys)).join("")}</tbody></table></div>
   <h3>全部單一條件 <select id="btSort"><option value="lift">依倍數排序</option><option value="r20">依20日報酬排序</option></select></h3>
   <div class="tablewrap" style="max-height:50vh"><table><thead>${head}</thead><tbody>${sigs.map(r=>btRow(r,[r.key])).join("")}</tbody></table></div>
   <p class="hint">⚠ 回測只代表過去一年的統計，市場狀況改變時結果會不同；僅涵蓋目前仍上市櫃的股票（倖存者偏差），也未計入手續費與滑價。不是投資建議。</p>`;
  $("btSort").value=btSort; $("btSort").onchange=e=>{btSort=e.target.value; renderBT();};
  $("btClose").onclick=()=>{$("btBox").hidden=true;};
  $("btBox").querySelectorAll("tr.click").forEach(tr=>tr.onclick=()=>applyKeys(tr.dataset.keys.split(",")));
}

async function loadBT(){ if(BT) return BT; try{ const r=await fetch("data/backtest.json?t="+Date.now()); if(r.ok) BT=await r.json(); }catch(e){} return BT; }
function kv(label,v,d,opt={}){ let s=isNum(v)?fmt(v,d):(v===true?"是":v===false?"否":(v??"–")); if(opt.unit&&isNum(v)) s+=opt.unit;
  const cls=opt.sign&&isNum(v)?(v>0?"pos":v<0?"neg":""):""; return `<div class="kv"><span>${label}</span><span class="${cls}">${s}</span></div>`; }
async function showDiag(r){
  const box=$("diag"); box.hidden=false;
  await loadBT(); const b=BTP(); const m=b&&b.model; const stats={}; if(b) b.signals.forEach(x=>stats[x.key]=x);
  const base=m?m.base_rate:(b?b.baseline.p_big:null);
  const prob=r.prob, lift=isNum(prob)&&base?prob/base:null;
  const on=(r.sig_on||[]).map(k=>stats[k]).filter(Boolean).sort((a,c)=>cmpNum(c.lift,a.lift));
  const sigRows=on.map(x=>`<tr><td class="l">${x.name}${x.n<300?' <span class="tag">樣本少</span>':""}</td><td>${fmt(x.p_big,1)}%</td>
     <td class="${x.lift>=1.2?"good":x.lift<1?"neg":""}">${fmt(x.lift,2)}×</td><td>${x.lift_h1??"–"} / ${x.lift_h2??"–"}</td><td>${x.n.toLocaleString()}</td></tr>`).join("");
  const pctile = isNum(prob) ? Math.round(DATA.filter(x=>isNum(x.prob)&&x.prob<=prob).length / DATA.filter(x=>isNum(x.prob)).length*100) : null;
  box.innerHTML=`
   <div class="chartHead"><h2>個股診斷：${r.code} ${r.name}　<span class="${r.chg_pct>0?"pos":r.chg_pct<0?"neg":""}">${fmt(r.close,2)}（${fmt(r.chg_pct,2)}%）</span></h2><button id="diagClose">關閉</button></div>
   <p class="hint">${r.market}｜${r.industry}｜股價日期 ${r.date}${r.inst_date?`｜法人 ${r.inst_date}`:""}</p>
   <h3>10 個交易日內漲 ≥ 10% 的機率（模型估計，依${PLABEL[PERIOD]}資料）</h3>
   ${isNum(prob)?`<div class="gauge"><span class="big ${lift>=1.3?"pos":""}">${fmt(prob,1)}%</span>
     <span>基準 ${base}%（隨機挑一檔）｜<b>${fmt(lift,2)} 倍</b>｜高於今天 ${pctile}% 的股票</span></div>
     <div class="bar"><i style="width:${Math.min(100,prob*2)}%"></i></div>
     <p class="hint">模型：用過去一年「哪些訊號同時出現」對「之後 10 日是否漲 ≥10%」做邏輯斯迴歸。以 ${m.test_from} 之後的資料做樣本外測試，AUC ${m.auc_test??"–"}
     （0.5＝跟亂猜一樣，0.6 以上算有一定鑑別力）。${m.calib&&m.calib.length?"樣本外校準："+m.calib.map(c=>`預測 ${c.pred}% → 實際 ${c.actual}%`).join("、")+"。":""}
     機率是統計上的傾向，不是保證，也不是投資建議。</p>`
   :'<p class="hint">尚無模型估計（回測尚未產生，或這檔股票資料不足 80 天）。</p>'}
   <h3>目前成立的訊號（${on.length} 個）與歷史表現</h3>
   ${on.length?`<div class="tablewrap" style="max-height:260px"><table><thead><tr><th class="l">訊號</th><th>歷史 10 日內漲≥10% 機率</th><th>倍數</th><th>穩定度</th><th>樣本</th></tr></thead><tbody>${sigRows}</tbody></table></div>`:'<p class="hint">目前沒有任何回測訊號成立。</p>'}
   <h3>目前技術指標</h3>
   <div class="dgrid">
    <div class="dbox"><b>均線</b>${kv("站上月線",r.above_ma20)}${kv("站上季線",r.above_ma60)}${kv("站上年線",r.above_ma240)}
      ${kv("均線多頭排列",r.ma_bull)}${kv("月線斜率（%/日）",r.ma20_s,3,{sign:1})}${kv("月線上彎",r.ma20_bend)}${kv("乖離率 20",r.bias20,1,{unit:"%",sign:1})}</div>
    <div class="dbox"><b>動能</b>${kv("RSI(14)",r.rsi,1)}${kv("K / D",isNum(r.K)?fmt(r.K,1)+" / "+fmt(r.D,1):"–")}${kv("KD 今日金叉",r.kd_golden)}
      ${kv("DIF 在 MACD 上",r.macd_pos)}${kv("MACD 柱",r.hist,3,{sign:1})}${kv("ADX",r.adx,1)}${kv("+DI > -DI",r.dmi_bull)}</div>
    <div class="dbox"><b>布林通道</b>${kv("上軌",r.bb_up,4)}${kv("上軌 3 日斜率（元/日）",r.bb_up_s3,4,{sign:1})}${kv("上軌 3 日斜率（%/日）",r.bb_up_s3_pct,3,{sign:1})}
      ${kv("月線 3 日未遞減",r.ma20_nodown3)}${kv("位置（0=下軌，1=上軌）",r.bb_pos,2)}${kv("帶寬變化",r.bbw_s,2,{sign:1})}${kv("布林收斂",r.bb_squeeze)}</div>
    <div class="dbox"><b>量能</b>${kv("成交量（張）",r.vol_lots,0)}${kv("量比",r.vol_ratio,2)}${kv("5日均量 > 20日均量",r.vol_expand)}
      ${kv("20 日平均振幅",r.amp20,1,{unit:"%"})}${kv("20 日漲跌",r.ret20,1,{unit:"%",sign:1})}${kv("突破 20 日高",r.breakout20)}</div>
    <div class="dbox"><b>籌碼</b>${kv("外資 今日（張）",r.f1,0,{sign:1})}${kv("外資 5 日（張｜‰股本）",isNum(r.f5)?fmt(r.f5,0)+"｜"+fmt(r.f5_cap,2)+"‰":"–")}
      ${kv("投信 今日（張）",r.t1,0,{sign:1})}${kv("投信 5 日（張｜‰股本）",isNum(r.t5)?fmt(r.t5,0)+"｜"+fmt(r.t5_cap,2)+"‰":"–")}
      ${kv("外資／投信 連買",isNum(r.f_streak)?r.f_streak+" / "+r.t_streak:"–")}${kv("融資 5 日增減（張）",r.m_chg5,0,{sign:1})}${kv("券資比",r.ms_ratio,1,{unit:"%"})}
      ${kv("認購權證量倍數",r.w_surge,1)}</div>
    <div class="dbox"><b>支撐壓力（下一交易日 CDP）</b>${kv("強壓力 AH",r.ah,2)}${kv("壓力 NH",r.nh,2)}${kv("支撐 NL",r.nl,2)}${kv("強支撐 AL",r.al,2)}
      ${kv("做多支撐",isNum(r.sup)?fmt(r.sup,2)+"（"+(r.sup_name||"")+"）":"–")}${kv("距做多支撐",r.sup_dist,1,{unit:"%"})}${kv("當沖方向",r.dt_dir)}</div>
   </div>`;
  $("diagClose").onclick=()=>{ box.hidden=true; };
  box.scrollIntoView({behavior:"smooth",block:"start"});
}
function openStock(r){ current={code:r.code,name:r.name,row:r}; showDiag(r); drawChart(r.code,r.name); }
$("q").addEventListener("keydown",e=>{
  if(e.key!=="Enter") return;
  const q=$("q").value.trim().toLowerCase(); if(!q) return;
  const r=DATA.find(x=>x.code===q) || DATA.find(x=>x.name.toLowerCase()===q) || DATA.find(x=>x.code.startsWith(q)||x.name.toLowerCase().includes(q));
  if(r) openStock(r); else alert("找不到這檔股票（可能上市未滿 80 個交易日或不在清單內）");
});

// ------------------------------------------------------------------ 線圖
const cache={};
async function drawChart(code,name){
  $("chartBox").hidden=false; $("chartTitle").textContent=`${code} ${name}`;
  const mkt=(current&&current.row&&current.row.market)==="上櫃" ? "TWO" : "TW";
  const L=[["看分點：Yahoo 主力進出",`https://tw.stock.yahoo.com/quote/${code}.${mkt}/broker-trading`],
           ["HiStock 分點",`https://histock.tw/stock/branch.aspx?no=${code}`],
           ["富邦 主力進出",`https://fubon-ebrokerdj.fbs.com.tw/z/zc/zco/zco_${code}.djhtm`]];
  $("links").innerHTML=L.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${t} ↗</a>`).join("");
  if($("diag").hidden) $("chartBox").scrollIntoView({behavior:"smooth",block:"start"});
  let p=cache[code];
  if(!p){ try{ p=cache[code]=await (await fetch(`data/px/${code}.json`)).json(); }
          catch(e){ $("chart").textContent="讀不到線圖資料"; return; } }
  const x=p.d, UP="#d32f2f", DN="#2e7d32";
  const line=(y,name,color,yaxis,extra={})=>({type:"scatter",mode:"lines",x,y,name,yaxis,line:{width:1.2,color},hoverinfo:"y+name",...extra});
  const ref=(v,yaxis)=>({type:"scatter",mode:"lines",x,y:x.map(()=>v),yaxis,showlegend:false,hoverinfo:"skip",line:{width:1,dash:"dot",color:"#9e9e9e"}});
  const tr=[
    {type:"candlestick",x,open:p.o,high:p.h,low:p.l,close:p.c,name:"K線",increasing:{line:{color:UP},fillcolor:UP},decreasing:{line:{color:DN},fillcolor:DN}},
    line(p.ma5,"MA5","#f9a825","y"), line(p.ma10,"MA10","#8d6e63","y"), line(p.ma20,"月線","#1565c0","y"), line(p.ma60,"季線","#6a1b9a","y"),
    line(p.ma120,"半年線","#00897b","y",{visible:"legendonly"}), line(p.ma240,"年線","#616161","y",{visible:"legendonly"}),
    {type:"bar",x,y:p.v,name:"量(張)",yaxis:"y2",marker:{color:p.c.map((c,i)=>c>=p.o[i]?UP:DN)}}
  ];
  if($("sr").checked){
    const n=p.c.length-1, H=p.h[n], L=p.l[n], C=p.c[n], cdp=(H+L+2*C)/4, rg=H-L, xs=x.slice(-20);
    const hl=(v,name,color,dash)=>({type:"scatter",mode:"lines",x:xs,y:xs.map(()=>+v.toFixed(2)),yaxis:"y",name,
      line:{width:1.3,dash,color},hovertemplate:name+" %{y}<extra></extra>"});
    tr.push(hl(cdp+rg,"強壓力 AH","#b71c1c","dot"), hl(2*cdp-L,"壓力 NH","#e57373","dash"),
            hl(2*cdp-H,"支撐 NL","#81c784","dash"), hl(cdp-rg,"強支撐 AL","#1b5e20","dot"));
    const row=current&&current.row;
    if(row && isNum(row.sup)) tr.push(hl(row.sup,`做多支撐（${row.sup_name}）`,"#1565c0","solid"));
  }
  if($("bb").checked) tr.push(line(p.up,"布林上軌","#90a4ae","y",{line:{dash:"dash",width:1,color:"#90a4ae"}}), line(p.dn,"布林下軌","#90a4ae","y",{line:{dash:"dash",width:1,color:"#90a4ae"}}));
  const s=$("sub").value, Y="y3"; let range=null;
  if(s==="KD"){ tr.push(line(p.K,"K","#ef6c00",Y),line(p.D,"D","#00838f",Y),ref(20,Y),ref(80,Y)); range=[0,100]; }
  if(s==="RSI"){ tr.push(line(p.rsi,"RSI14","#6a1b9a",Y),ref(30,Y),ref(70,Y)); range=[0,100]; }
  if(s==="MACD"){ const h=p.dif.map((d,i)=>d==null||p.macd[i]==null?null:+(d-p.macd[i]).toFixed(3));
    tr.push({type:"bar",x,y:h,name:"柱狀體",yaxis:Y,marker:{color:h.map(v=>v>=0?UP:DN)}},line(p.dif,"DIF","#1565c0",Y),line(p.macd,"MACD","#ef6c00",Y)); }
  if(s==="法人買賣超"){ if(!p.fi){ tr.push(ref(0,Y)); } else {
    tr.push({type:"bar",x,y:p.fi,name:"外資",yaxis:Y,marker:{color:"#1565c0"}},
            {type:"bar",x,y:p.ti,name:"投信",yaxis:Y,marker:{color:"#ef6c00"}},
            {type:"bar",x,y:p.di,name:"自營商",yaxis:Y,marker:{color:"#8d6e63"}});
    const cum=a=>{let s=0,seen=false; return a.map(v=>{ if(v==null) return seen?s:null; seen=true; s+=v; return s; });};
    tr.push(line(cum(p.fi),"外資累積","#1565c0","y4",{line:{width:2,dash:"dot",color:"#1565c0"}}),
            line(cum(p.ti),"投信累積","#ef6c00","y4",{line:{width:2,dash:"dot",color:"#ef6c00"}})); } }
  if(s==="融資融券"){ if(p.mb){ tr.push(line(p.mb,"融資餘額(張)","#d32f2f",Y,{connectgaps:true}),
                                       line(p.sb,"融券餘額(張)","#2e7d32","y4",{connectgaps:true})); } else tr.push(ref(0,Y)); }
  if(s==="DMI"){ tr.push(line(p.pdi,"+DI",UP,Y),line(p.mdi,"-DI",DN,Y),line(p.adx,"ADX","#212121",Y),ref(25,Y)); }
  if(s==="OBV"){ tr.push(line(p.obv,"OBV(千張)","#1565c0",Y),line(p.obv_ma20,"OBV MA20","#ef6c00",Y)); }
  if(s==="W%R"){ tr.push(line(p.wr,"W%R","#00838f",Y),ref(-20,Y),ref(-80,Y)); range=[-100,0]; }
  if(s==="CCI"){ tr.push(line(p.cci,"CCI","#5d4037",Y),ref(100,Y),ref(-100,Y)); }
  if(s==="MFI"){ tr.push(line(p.mfi,"MFI","#ad1457",Y),ref(20,Y),ref(80,Y)); range=[0,100]; }
  if(s==="乖離率"){ tr.push(line(p.bias20,"乖離20%","#455a64",Y),ref(0,Y)); }
  const dark=matchMedia("(prefers-color-scheme: dark)").matches, fg=dark?"#e6e9ef":"#1d2330", grid=dark?"#2b313c":"#eceff3";
  const ax=(dom,extra={})=>({domain:dom,gridcolor:grid,zeroline:false,fixedrange:false,...extra});
  Plotly.react("chart",tr,{
    margin:{l:50,r:20,t:10,b:40}, paper_bgcolor:"rgba(0,0,0,0)", plot_bgcolor:"rgba(0,0,0,0)", font:{color:fg,size:12},
    hovermode:"x unified", showlegend:true, legend:{orientation:"h",y:1.06},
    xaxis:{type:"category",rangeslider:{visible:false},nticks:8,gridcolor:grid,showspikes:true},
    yaxis:ax([0.46,1],{title:"股價"}), yaxis2:ax([0.28,0.42],{title:"張"}),
    yaxis3:ax([0,0.24],{title:s==="法人買賣超"?"張":s==="融資融券"?"融資(張)":s,...(range?{range}:{})}),
    yaxis4:{overlaying:"y3",side:"right",showgrid:false,zeroline:false,title:s==="融資融券"?"融券(張)":s==="法人買賣超"?"累積(張)":""},
    barmode:"relative", bargap:0.2
  },{responsive:true,displaylogo:false});
}
</script>
