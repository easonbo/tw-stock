name: 每日更新台股資料

on:
  schedule:
    - cron: "30 7 * * 1-5"      # 台灣時間 週一～五 15:30：股價＋三大法人
    - cron: "40 13 * * 1-5"     # 台灣時間 週一～五 21:40：補融資融券
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "update.py", ".github/workflows/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 取回歷史價量快取
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: hist-${{ github.run_id }}
          restore-keys: hist-
      - name: 下載價量並計算指標
        run: python update.py
      - name: 儲存歷史價量快取
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: hist-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
