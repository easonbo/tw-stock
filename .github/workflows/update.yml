name: 每日更新台股資料

on:
  schedule:
    # GitHub 的排程在尖峰時段常延遲或被跳過，所以避開整點、並多排幾次備援
    - cron: "7,37 1-5 * * 1-5"          # 台灣時間 9:07–13:37 每 30 分鐘：盤中股價（快速）
    - cron: "17,47 7 * * 1-5"           # 台灣時間 15:17、15:47：收盤股價
    - cron: "23,53 8 * * 1-5"           # 台灣時間 16:23、16:53：三大法人
    - cron: "29 9 * * 1-5"              # 台灣時間 17:29：三大法人（備援）
    - cron: "43 13 * * 1-5"             # 台灣時間 21:43：融資融券
    - cron: "13 14 * * 1-5"             # 台灣時間 22:13：融資融券（備援）
  workflow_dispatch:
    inputs:
      mode:
        description: "更新模式（盤中快速＝只更新股價，約 5 分鐘）"
        type: choice
        options: [盤中快速, 完整]
        default: 盤中快速
  push:
    branches: [main]
    paths: ["site/**", "update.py", ".github/workflows/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 安裝永豐 Shioaji（選用，失敗時自動改用 Yahoo）
        run: pip install shioaji || echo "shioaji 安裝失敗，改用 Yahoo"
      - name: 取回歷史價量快取
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: hist-${{ github.run_id }}
          restore-keys: hist-
      - name: 下載價量並計算指標
        run: python update.py
        env:
          INTRADAY: ${{ (github.event.schedule == '7,37 1-5 * * 1-5' || inputs.mode == '盤中快速') && '1' || '0' }}
          SJ_API_KEY: ${{ secrets.SJ_API_KEY }}
          SJ_SECRET_KEY: ${{ secrets.SJ_SECRET_KEY }}
      - name: 儲存歷史價量快取
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: hist-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
